<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C8636F"/>
      <stop offset="65%" stop-color="#ad2c51"/>
      <stop offset="100%" stop-color="#6e1a34"/>
    </radialGradient>
    <radialGradient id="petalGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ffd5e5"/>
      <stop offset="100%" stop-color="#F678A4"/>
    </radialGradient>
    <radialGradient id="goldCore" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="55%" stop-color="#f5c253"/>
      <stop offset="100%" stop-color="#c68a1f"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#4a0f20" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Medallion -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="#f6c2d1" stroke-width="0.8" opacity="0.6"/>

